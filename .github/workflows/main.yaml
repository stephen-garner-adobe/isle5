name: Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm ci
    - run: npm run lint
    - run: npm run check:ue
    - name: Verify generated Universal Editor artifacts
      run: |
        npm run build:json
        git diff --exit-code -- component-definition.json component-models.json component-filters.json
